<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>语音转写</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <header class="page-header">
        <p class="eyebrow">豆包语音 · 录音文件识别模型 2.0</p>
        <h1>语音转写</h1>
        <p class="lede">
          把录音拖进下面的区域。本地服务会把文件交给火山引擎，转成带时间戳和说话人的文字。
          单文件不超过 512MB、5 小时。结果通常要等几分钟。
        </p>
      </header>

      <form id="form" action="/api/transcribe" method="post">
        <fieldset>
          <legend>接口凭证</legend>
          <div class="field">
            <label for="api-key">API Key</label>
            <div class="password-row">
              <input
                id="api-key"
                name="api_key"
                type="password"
                autocomplete="off"
                spellcheck="false"
                required
                aria-describedby="key-help">
              <button type="button" id="toggle-key" aria-pressed="false" aria-controls="api-key">
                显示
              </button>
            </div>
            <p id="key-help" class="hint">
              在
              <a href="https://console.volcengine.com/speech/new/overview" target="_blank" rel="noopener noreferrer">豆包语音控制台</a>
              开通「豆包录音文件识别模型 2.0」，再到 API Key 管理里复制。Key 只留在这台电脑的浏览器里。
            </p>
          </div>
        </fieldset>

        <fieldset>
          <legend>录音文件</legend>
          <div class="field">
            <label class="dropzone" id="dropzone" for="file">
              <span class="dropzone-title" id="drop-title">把录音拖到这里，或点击选择</span>
              <span class="hint" id="drop-hint">wav、mp3、m4a、aac、ogg、amr。可以一次放多段，会按顺序转写。</span>
            </label>
            <input
              id="file"
              name="file"
              type="file"
              class="dropzone-input"
              accept=".wav,.mp3,.mpeg,.ogg,.opus,.spx,.amr,.aac,.m4a,.mp4,audio/*"
              multiple
              aria-describedby="drop-hint">
            <ul id="file-list" class="file-list" hidden></ul>
          </div>
        </fieldset>

        <fieldset>
          <legend>识别选项</legend>
          <div class="checks">
            <label class="check" for="enable-speaker">
              <input id="enable-speaker" name="enable_speaker_info" type="checkbox" checked>
              <span>区分说话人</span>
            </label>
            <label class="check" for="enable-punc">
              <input id="enable-punc" name="enable_punc" type="checkbox" checked>
              <span>自动标点</span>
            </label>
            <label class="check" for="enable-itn">
              <input id="enable-itn" name="enable_itn" type="checkbox" checked>
              <span>数字规整</span>
            </label>
            <label class="check" for="enable-ddc">
              <input id="enable-ddc" name="enable_ddc" type="checkbox">
              <span>去掉口头禅</span>
            </label>
            <label class="check" for="enable-channel">
              <input id="enable-channel" name="enable_channel_split" type="checkbox">
              <span>左右声道分开</span>
            </label>
          </div>
          <div class="field">
            <label for="hotwords">专有名词</label>
            <textarea
              id="hotwords"
              name="hotwords"
              rows="3"
              placeholder="每行一个，例如人名、产品名、专业术语"></textarea>
            <p class="hint">这些词会优先被识别出来。人名、产品名、专业术语可以写在这里。</p>
          </div>
        </fieldset>

        <div class="actions">
          <button type="submit" id="submit">开始转写</button>
        </div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <progress id="progress" hidden max="100" value="0"></progress>
      </form>

      <section id="results" class="results" aria-live="polite"></section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
